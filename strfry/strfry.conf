# Strfry NOSTR Relay Configuration
# Isolated relay for myhistoree - no public connection

relay {
    db = "/app/strfry-db"
    maxWebsocketPayloadSize = 131072
    maxWebsocketConnections = 1024
    maxWebsocketBytesPerSec = 1000000
    numThreads = 2
    events = {
        maxEventsPerSecond = 10
        maxEventSize = 65536
        rejectEphemeralEvents = false
    }
}

server {
    ip = "0.0.0.0"
    port = 7777

    relayInfo = {
        name = "myhistoree internal relay"
        description = "Dedicated relay for Hausärzte im Grillepark"
        pubkey = ""
        contact = ""
    }
}
