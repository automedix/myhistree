services:
  myhistoree:
    build:
      context: .
      dockerfile: Dockerfile
    image: myhistoree-myhistoree:latest
    container_name: myhistoree
    restart: unless-stopped
    ports:
      - "3456:3456"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - TZ=Europe/Berlin
      - PORT=3456
      - DB_PATH=/app/data/myhistoree.db
      # REQUIRED: Set all secrets via env vars or .env file
      # JWT_SECRET=               # Generate with: openssl rand -base64 32
      # PASSWORD_PEPPER=          # Generate with: openssl rand -base64 16
      # DEFAULT_ADMIN_PASSWORD=   # Min. 12 characters
      # SMTP_HOST=                # e.g. smtp.ionos.de
      # SMTP_PORT=465
      # SMTP_USER=                # Your sender email
      # SMTP_PASS=                # Your SMTP password
      # EMAIL_REPLY_TO=           # Reply-To address
    networks:
      - myhistoree

  strfry:
    image: ghcr.io/hoytech/strfry:latest
    container_name: strfry-relay
    restart: unless-stopped
    ports:
      - "7777:7777"
    volumes:
      - ./strfry/data:/app/strfry-db
      - ./strfry/strfry.conf:/etc/strfry.conf:ro
    networks:
      - myhistoree
    command: ["relay"]

networks:
  myhistoree:
    driver: bridge
