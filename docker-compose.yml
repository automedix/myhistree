services:
  myhistree:
    image: myhistree-myhistree:stable
    container_name: myhistree
    restart: unless-stopped
    ports:
      - "3456:3456"
    volumes:
      - ./data:/app/data
      - ./web:/app/web
      # NOTE: server/dist is baked into the image — never mount it from host!
    env_file: .env
    environment:
      - NODE_ENV=production
      - TZ=Europe/Berlin
      - PORT=3456
      - DB_PATH=/app/data/myhistoree.db
    networks:
      - myhistree

networks:
  myhistree:
    driver: bridge
