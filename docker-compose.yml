services:
  myhistree:
    build:
      context: .
      dockerfile: Dockerfile
    image: myhistree-myhistree:latest
    container_name: myhistree
    restart: unless-stopped
    ports:
      - "3456:3456"
    volumes:
      - ./data:/app/data
    env_file: .env
    environment:
      - NODE_ENV=production
      - TZ=Europe/Berlin
      - PORT=3456
      - DB_PATH=/app/data/myhistoree.db
    networks:
      - myhistree

  strfry:
    image: ghcr.io/hoytech/strfry:latest
    container_name: strfry-relay
    restart: unless-stopped
    ports:
      - "7777:7777"
    volumes:
      - ./strfry/data:/app/strfry-db
      - ./strfry/strfry.conf:/etc/strfry.conf:ro
    networks:
      - myhistree
    command: ["relay"]

networks:
  myhistree:
    driver: bridge
