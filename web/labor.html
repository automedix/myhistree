<style>
:root{--primary:#4477BB;--bg:#f1f5f9;--card:#fff;--text:#1e293b;--text-light:#64748b;--border:#e2e8f0;--success:#22c55e;--radius:12px;}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;}
body{background:var(--bg);color:var(--text);line-height:1.5;padding:20px;}
.container{max-width:800px;margin:0 auto;}
header{background:var(--primary);color:#fff;padding:24px;border-radius:var(--radius);margin-bottom:24px;text-align:center;}
header h1{font-size:1.5rem;margin-bottom:4px;}
header p{font-size:0.875rem;opacity:0.9;}
.search-box{position:relative;margin-bottom:20px;}
.search-box input{width:100%;padding:16px 20px 16px 48px;border:2px solid var(--border);border-radius:var(--radius);font-size:1.125rem;transition:border-color .2s;background:var(--card);}
.search-box input:focus{outline:none;border-color:var(--primary);}
.search-box::before{content:"🔍";position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:1.25rem;}
.stats{text-align:center;color:var(--text-light);font-size:0.875rem;margin-bottom:16px;}
.results{background:var(--card);border-radius:var(--radius);box-shadow:0 2px 8px rgba(0,0,0,.04);overflow:hidden;}
.result-item{padding:14px 20px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;display:flex;justify-content:space-between;align-items:center;gap:12px;}
.result-item:hover{background:#f8fafc;}
.result-item:last-child{border-bottom:none;}
.result-name{flex:1;font-size:0.95rem;}
.result-meta{display:flex;gap:16px;align-items:center;flex-shrink:0;}
.result-material{color:var(--text-light);font-size:0.8rem;background:#f1f5f9;padding:2px 8px;border-radius:4px;}
.result-price{font-weight:600;color:var(--primary);font-size:0.95rem;white-space:nowrap;}
.result-item.copied{background:#dcfce7 !important;}
.result-item.copied .result-price{color:#166534;}
.no-results{text-align:center;padding:40px;color:var(--text-light);font-size:0.95rem;}
.hidden{display:none !important;}
@media(max-width:500px){
  .result-item{flex-direction:column;align-items:flex-start;gap:6px;}
  .result-meta{flex-direction:row;width:100%;justify-content:space-between;}
}
</style>

const resultsEl = document.getElementById('results');
const statsEl = document.getElementById('stats');
const searchInput = document.getElementById('searchInput');

function fmtPrice(p) {
  return p ? p.toFixed(2).replace('.', ',') + ' €' : '';
}

function getMaterialLabel(m) {
  const map = { 'S': 'Serum', 'P': 'Plasma', 'E': 'EDTA', 'U': 'Urin', 'B': 'Vollblut', 'F': 'Stuhl', 'A': 'Abstrich' };
  return map[m] || m;
}

function render(items) {
  if (items.length === 0) {
    resultsEl.innerHTML = '<div class="no-results">Keine Leistungen gefunden</div>';
    statsEl.textContent = '0 Ergebnisse';
    return;
  }
  resultsEl.innerHTML = items.map((item, i) => `
    <div class="result-item" data-idx="${i}" onclick="copyItem(this, '${item.name.replace(/'/g, "\\'")}', '${fmtPrice(item.price)}')">
      <div class="result-name">${highlight(item.name)}</div>
      <div class="result-meta">
        <span class="result-material" title="Material: ${getMaterialLabel(item.material)}">${item.material}</span>
        <span class="result-price">${fmtPrice(item.price)}</span>
      </div>
    </div>
  `).join('');
  statsEl.textContent = `${items.length} Ergebnis${items.length !== 1 ? 'se' : ''}`;
}

function highlight(name) {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) return name;
  const idx = name.toLowerCase().indexOf(q);
  if (idx === -1) return name;
  return name.slice(0, idx) + '<strong>' + name.slice(idx, idx + q.length) + '</strong>' + name.slice(idx + q.length);
}

function copyItem(el, name, price) {
  const text = `${name} — ${price}`;
  navigator.clipboard.writeText(text).then(() => {
    document.querySelectorAll('.result-item').forEach(e => e.classList.remove('copied'));
    el.classList.add('copied');
    setTimeout(() => el.classList.remove('copied'), 1500);
  }).catch(() => {});
}

function search() {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) {
    render(LABOR_DATA);
    return;
  }
  const filtered = LABOR_DATA.filter(item => 
    item.name.toLowerCase().includes(q) ||
    item.material.toLowerCase().includes(q)
  );
  render(filtered);
}

// Live search
searchInput.addEventListener('input', search);

// Init
render(LABOR_DATA);

// Focus
searchInput.focus();
